<!doctype html>
<html lang="ko"><meta charset="utf-8"><title>전투 연출 화면 검증</title>
<style>body{margin:0;background:#101820;color:#eee;font:14px system-ui}#tools{position:relative;z-index:5000;padding:8px}button,select{padding:7px;margin:3px}#game{height:calc(100vh - 100px)}canvas{display:block}#status{margin:4px}</style>
<div id="tools">
  <label>연출 <select id="effect"><option value="signal">연쇄 번개·투사체</option><option value="mechanic">톱날·충격파</option><option value="cross">교차 절삭</option><option value="spin">회전 분쇄</option><option value="carrier">폭발·독 장판</option><option value="enemy">적 빔·투사체</option><option value="death">적 사망</option></select></label>
  <button data-age="0">시작</button><button data-age=".08">초반</button><button data-age=".13">중간</button><button data-age=".3">종료</button><button data-age=".6">한 바퀴 후</button><button id="play">느리게 재생</button>
  <p id="status">검증 전용 페이지 — 캐릭터를 선택하면 실제 배경과 렌더러로 연출을 확인합니다.</p>
</div><div id="game"></div>
<script type="module">
import Phaser from 'phaser';
import {GameScene} from '/src/scenes/GameScene.ts';
import {CharacterCombat} from '/src/combat/CharacterCombat.ts';
import {StageEnemySystem} from '/src/enemies/StageEnemySystem.ts';
import {characterWeapons,auxiliaryWeapons} from '/src/config/characterWeapons.ts';
import {loadGameFont} from '/src/ui/loadGameFont.ts';
import {ExperienceSystem} from '/src/experience/ExperienceSystem.ts';
await loadGameFont();
// Only this test entry owns a stopped clock; production scenes have no debug hooks.
class Preview extends GameScene { update() {} }
const game=new Phaser.Game({type:Phaser.AUTO,parent:'game',width:1280,height:720,scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_BOTH},scene:[Preview]});
const select=document.querySelector('#effect'),status=document.querySelector('#status');let playback;
function setup(){
  cancelAnimationFrame(playback);
  const scene=game.scene.getScene('GameScene');if(!scene.character)return;
  scene.encounterTransition?.update(10000);scene.encounterTransition?.update(10000);
  scene.selectingSkill=true;
  const p=scene.player.body,id=select.value;
  const melee=id==='cross'||id==='spin';
  scene.enemyRenderer.updateDeaths(1,[]);
  const system=new StageEnemySystem(scene.world,()=>.37);system.nextId=scene.enemySystem.nextId;scene.enemySystem=system;
  for(const [type,dx,dy] of (melee ? [['E01',64,0],['E04',300,0],['E03',-64,0]] : [['E01',180,-80],['E04',290,30],['E03',-210,65]])){
    const e=system.create(type,{x:p.x+dx,y:p.y+dy});e.age=2;system.enemies.push(e);
  }
  const skillId=id==='cross'?7:9;
  const c=new CharacterCombat(melee?'mechanic':['enemy','death'].includes(id)?'signal':id,p,()=>melee?(skillId-1+.01)/22:.99);scene.character=c;scene.player.setCharacter(c.character);
  scene.renderActors();scene.impactRenderer.observe(1,[p,...system.enemies]);
  if(melee){
    c.progression.observeLevel(2);const offer=c.progression.offer();
    c.choose(offer.token,0,new ExperienceSystem());
    if(id==='spin'){c.attacks=3;c.mainTimer=0;}else{c.mainTimer=100;c.auxiliaryTimers.set(skillId,0);}
    c.prepare(0,p,system.enemies);c.update(0,scene.world,scene.getViewport());
  }else if(id==='death'){
    for(const e of system.enemies)e.hp=0;
    scene.impactRenderer.observe(0,[p,...system.enemies]);
    scene.enemyRenderer.updateDeaths(0,system.removeDefeated());
  }else if(id==='enemy'){
    const e=system.enemies[2];
    system.attacks.hazard(e.id,'lane',e,{x:p.x+260,y:e.y},{width:28,warning:0,duration:.3});
    for(const [i,angle] of [0,.7,1.4].entries()){
      system.attacks.shoot(e,angle,0,system.attacks.group());const shot=system.attacks.projectiles.at(-1);shot.x=p.x-80+i*80;shot.y=p.y-100;
    }
  }else{
    for(const [i,config] of auxiliaryWeapons[id].filter(w=>w.kind==='projectile').entries())c.shots.push({x:p.x-100+i*80,y:p.y-110,vx:100,vy:0,config});
    const zone=auxiliaryWeapons[id].find(w=>w.kind==='zone');c.zones.push({x:p.x-150,y:p.y+110,age:1,config:zone});
    if(id==='signal'){
      const chain=[p,...system.enemies.slice(0,2)];for(let i=1;i<chain.length;i++)c.effects.push({...chain[i-1],to:chain[i],radius:0,remaining:characterWeapons.effectDuration});
    }else{
      c.effects.push({x:p.x+180,y:p.y-80,radius:100,remaining:characterWeapons.effectDuration});
      if(id==='mechanic')c.swings.push({angle:0,age:0,radius:characterWeapons.mechanic.radius});
      else c.mines.push({x:p.x+90,y:p.y+90,age:1,payload:{charged:false}});
    }
  }
  return {scene,system,c,id,age:0,melee};
}
function render(f,age){
  const delta=Math.max(0,age-f.age);
  f.scene.enemyRenderer.updateDeaths(delta,[]);f.age=age;
  if(f.melee){f.c.prepare(delta,f.c.player,f.system.enemies);f.c.update(delta,f.scene.world,f.scene.getViewport());}
  else {
    for(const effect of f.c.effects)effect.remaining=characterWeapons.effectDuration-age;
    for(const swing of f.c.swings){swing.age=age;swing.angle=age*4;}
  }
  for(const h of f.system.attacks.hazards)h.age=age;
  f.scene.renderActors();f.scene.characterRenderer.sync(f.c);f.scene.impactRenderer.sync();
  status.textContent=`${select.selectedOptions[0].text} · ${age.toFixed(2)}초 · 생존 적 ${f.system.enemies.length} · 사라지는 몸체 ${f.scene.enemyRenderer.deaths.size}`;
}
function preview(age){const f=setup();if(f)render(f,age);}
select.onchange=()=>preview(.08);
document.querySelectorAll('[data-age]').forEach(b=>b.onclick=()=>preview(Number(b.dataset.age)));
document.querySelector('#play').onclick=()=>{const f=setup();if(!f)return;let last=performance.now(),age=0;function tick(now){age+=Math.min(.05,(now-last)/1000)*.25;last=now;render(f,age);if(age<(f.melee?characterWeapons.mechanic.duration+.1:.5))playback=requestAnimationFrame(tick);}playback=requestAnimationFrame(tick);};
</script></html>
